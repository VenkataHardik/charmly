<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="fur" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#fbf4ee"/><stop offset="1" stop-color="#e6d6cb"/>
    </radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#5a4a8a"/><stop offset="1" stop-color="#1c1633"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd0e4"/><stop offset="1" stop-color="#ff8fbf"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <path d="M34 92 C28 58 36 30 50 22 C64 30 80 48 88 62 Z" fill="url(#fur)" stroke="#d9c4b6" stroke-width="3"/>
  <path d="M166 92 C172 58 164 30 150 22 C136 30 120 48 112 62 Z" fill="url(#fur)" stroke="#d9c4b6" stroke-width="3"/>
  <path d="M46 78 C44 58 48 42 54 36 C62 44 70 54 74 62 Z" fill="#ffc2d6"/>
  <path d="M154 78 C156 58 152 42 146 36 C138 44 130 54 126 62 Z" fill="#ffc2d6"/>
