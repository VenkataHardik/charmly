  <path d="M100 52 C156 52 184 84 184 122 C184 164 146 186 100 186 C54 186 16 164 16 122 C16 84 44 52 100 52 Z" fill="url(#fur)" stroke="#d9c4b6" stroke-width="3"/>
  <!-- peach tabby patch -->
  <path d="M84 56 C90 70 110 70 116 56 C110 54 90 54 84 56 Z" fill="#ffc9a3"/>
  <path d="M92 58 L96 70 M100 57 L100 72 M108 58 L104 70" stroke="#f3a674" stroke-width="3" stroke-linecap="round"/>
