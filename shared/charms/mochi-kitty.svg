  <ellipse cx="68" cy="122" rx="15" ry="18" fill="url(#eye)"/>
  <ellipse cx="132" cy="122" rx="15" ry="18" fill="url(#eye)"/>
  <circle cx="63" cy="115" r="6" fill="#fff"/><circle cx="127" cy="115" r="6" fill="#fff"/>
  <circle cx="73" cy="130" r="2.6" fill="#fff" opacity=".85"/><circle cx="137" cy="130" r="2.6" fill="#fff" opacity=".85"/>
  <!-- blush -->
  <ellipse cx="46" cy="148" rx="14" ry="8" fill="#ff9fc0" opacity=".55"/>
  <ellipse cx="154" cy="148" rx="14" ry="8" fill="#ff9fc0" opacity=".55"/>
  <!-- nose + ω mouth -->
  <path d="M94 140 L106 140 L100 147 Z" fill="#ff8fa8"/>
  <path d="M88 150 Q94 159 100 150 Q106 159 112 150" fill="none" stroke="#7a4d5c" stroke-width="3" stroke-linecap="round"/>
  <!-- flower on the left ear -->
  <g transform="translate(52 50)">
    <g fill="url(#petal)" stroke="#f06aa5" stroke-width="1.5">
      <ellipse cx="0" cy="-13" rx="9" ry="12"/>
      <ellipse cx="0" cy="-13" rx="9" ry="12" transform="rotate(72)"/>
      <ellipse cx="0" cy="-13" rx="9" ry="12" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13" rx="9" ry="12" transform="rotate(216)"/>
      <ellipse cx="0" cy="-13" rx="9" ry="12" transform="rotate(288)"/>
    </g>
    <circle r="7" fill="#ffd966" stroke="#f0b429" stroke-width="1.5"/>
  </g>
  <!-- shine -->
  <path d="M40 96 Q56 70 88 64" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
